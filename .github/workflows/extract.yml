name: M3U8 Extract Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚀 Checkout repository
      uses: actions/checkout@v4
    
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'  # ✅ Updated to Node.js 24
        cache: 'npm'
    
    - name: 🧹 Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
          libgbm1 libasound2 libx11-xcb1 libxcomposite1 \
          libxdamage1 libxrandr2 libxss1 libxtst6 \
          xvfb
    
    - name: 📦 Install project dependencies
      run: |
        npm ci  # ✅ Uses package-lock.json
        npx playwright install chromium
        npx playwright install-deps
    
    - name: 🔍 Run extractor
      run: node extract.js
      timeout-minutes: 5
    
    - name: 📤 Upload results
      uses: actions/upload-artifact@v4
      with:
        name: extracted-urls
        path: |
          m3u8.json
          proxy-url.txt
          m3u8-url.txt
        retention-days: 30
